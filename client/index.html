<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- Meta Tags SEO -->
    <title>Ministério Martinho S. S. Madureira | Pregações, Podcast e Ebooks</title>
    <meta name="description" content="Bem-vindo ao Ministério Martinho S. S. Madureira. Pregações, podcast VOZ DA FÉ, ebooks e muito mais para fortalecer sua jornada espiritual." />
    <meta name="keywords" content="ministério, pregações, podcast, fé, evangelho, ebooks, espiritualidade" />
    <meta name="author" content="Martinho Sábalo Sandala Madureira" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Portuguese" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Open Graph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ministeriomadureira.com/" />
    <meta property="og:title" content="Ministério Martinho S. S. Madureira" />
    <meta property="og:description" content="Pregações, podcast e ebooks para fortalecer sua fé." />
    <meta property="og:locale" content="pt_BR" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ministério Martinho S. S. Madureira" />
    <meta name="twitter:description" content="Pregações, podcast e ebooks para fortalecer sua fé." />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://ministeriomadureira.com/" />
    
    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
